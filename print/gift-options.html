<title>Pacific Plumbing: карта Woods Coffee</title>
<link rel="icon" href="../img/favicon.png">
<style>
:root{--bg:#eef0ec;--ink:#13201c;--card:#fff;--line:#d5dbd6;--acc:#c9733f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101815;--ink:#eef0ec;--card:#18221e;--line:#2a3631}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
figure b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;font-size:18px;margin-bottom:10px}
figure img{width:100%;height:auto;display:block;border-radius:6px}
</style>
</head>
