<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Три варианта | Pacific Plumbing</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f12">
<link rel="icon" href="../img/favicon.png">
<style>
:root{--bg:#0b0f12;--bar:rgb(11 15 18 / .82);--fg:#f2f6f7;--fg2:#9fb0b6;--teal:#2bbcc6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:56px 12px 64px;touch-action:pan-y}
.stage img{display:block;max-width:calc(100vw - 24px);max-height:calc(100vh - 132px);max-height:calc(100dvh - 132px);width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px -20px rgb(0 0 0 / .8);background:#fff}
.top,.bottom{position:fixed;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top{top:0;padding-top:max(10px,env(safe-area-inset-top))}
.bottom{bottom:0;justify-content:space-between;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.count{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:800;white-space:nowrap}
.cap{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap small{color:var(--fg2);font-weight:500;margin-left:6px}
button,.btn{appearance:none;border:0;background:rgb(255 255 255 / .1);color:var(--fg);font:inherit;font-weight:700;min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{background:rgb(255 255 255 / .18)}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.nav{position:fixed;top:56px;bottom:64px;width:30%;z-index:3;background:transparent;border-radius:0;padding:0}
.nav:hover{background:transparent}
.nav.prev{left:0}.nav.next{right:0}
.nav span{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255 / .12);font-size:22px;opacity:.0;transition:opacity .2s}
.nav.prev span{left:12px}.nav.next span{right:12px}
@media (hover:hover){.nav:hover span{opacity:1}}
.tabs{display:flex;gap:6px}
.tabs button.on{background:var(--teal);color:#06292c}
.grid{position:fixed;inset:0;z-index:10;background:rgb(11 15 18 / .97);overflow:auto;padding:68px 14px 30px;display:none}
.grid.on{display:block}
.grid h2{margin:18px 4px 10px;font-size:1rem;color:var(--fg2);font-weight:700}
.grid .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.grid a{display:block;border-radius:8px;overflow:hidden;background:#fff;aspect-ratio:3/4;position:relative;outline-offset:2px}
.grid a img{width:100%;height:100%;object-fit:cover;object-position:top}
.grid a i{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgb(0 0 0 / .78));color:#fff;font-style:normal;font-size:.78rem;line-height:1.2}
.grid a.cur{outline:3px solid var(--teal)}
.grid .close{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:11}
.hint{color:var(--fg2);font-size:.85rem}
@media (max-width:560px){.hide-s{display:none}.cap small{display:none}}
</style>
</head>
<body>
<div class="top">
  <span class="count" id="count">1 / 1</span>
  <span class="cap" id="cap"></span>
  <div class="tabs hide-s" id="tabs"></div>
  <button id="fs" type="button" aria-label="На весь экран">⛶<span class="hide-s">На весь экран</span></button>
</div>

<div class="stage" id="stage"><img id="img" alt=""></div>
<button class="nav prev" id="prev" type="button" aria-label="Назад"><span>‹</span></button>
<button class="nav next" id="next" type="button" aria-label="Дальше"><span>›</span></button>

<div class="bottom">
  <button id="b-prev" type="button" aria-label="Назад">‹ Назад</button>
  <button id="b-grid" type="button">Все слайды</button>
  <a class="btn hide-s" href="./">К выбору</a>
  <button id="b-next" type="button" aria-label="Дальше">Дальше ›</button>
</div>

<div class="grid" id="grid" aria-label="Все слайды">
  <button class="close" id="g-close" type="button">Закрыть</button>
  <div id="g-body"></div>
</div>

<script>
const S = 'shots/', P = '../print/previews/';
const NAMES = { a: 'Вариант A «Заказ-наряд»', b: 'Вариант B «Дождливый Беллингем»', c: 'Вариант C «Касатка»' };
function siteSlides(x){
  const n = NAMES[x];
  return [
    [x, S+x+'-index-phone.webp', n, 'главная, телефон'],
    [x, S+x+'-index-desktop.webp', n, 'главная, компьютер'],
    [x, S+x+'-services-phone.webp', n, 'услуги, телефон'],
    [x, S+x+'-estimate-phone.webp', n, 'бесплатный расчёт, телефон'],
    [x, S+x+'-estimate-checkup-phone.webp', n, 'куда ведёт QR с вешалки: бесплатная проверка'],
    [x, S+x+'-services-desktop.webp', n, 'услуги, компьютер'],
  ];
}
function printSlides(x, items){
  return items.map(([file, label]) => [x, P+x+'-'+file+'.png', NAMES[x], label]);
}
const ALL = {
  a: siteSlides('a').concat(printSlides('a', [['doorhanger-p1','вешалка на дверь, лицо'],['doorhanger-p2','вешалка на дверь, оборот'],['flyer-p1','листовка, лицо'],['flyer-p2','листовка, оборот']])),
  b: siteSlides('b').concat(printSlides('b', [['doorhanger-p1','вешалка на дверь, лицо'],['doorhanger-p2','вешалка на дверь, оборот'],['flyer-p1','листовка, лицо'],['flyer-p2','листовка, оборот']])),
  c: siteSlides('c').concat(printSlides('c', [['doorhanger-p1','вешалка 1, лицо'],['doorhanger-p2','вешалка 1, оборот'],['doorhanger-2-p1','вешалка 2, лицо'],['doorhanger-2-p2','вешалка 2, оборот'],['doorhanger-3-p1','вешалка 3, лицо'],['doorhanger-3-p2','вешалка 3, оборот'],['flyer-p1','листовка 1, лицо'],['flyer-p2','листовка 1, оборот'],['flyer-2-p1','листовка 2, лицо'],['flyer-2-p2','листовка 2, оборот'],['businesscard-p1','визитка, лицо'],['businesscard-p2','визитка, оборот']])),
};
const only = new URLSearchParams(location.search).get('v');
const slides = (only && ALL[only]) ? ALL[only] : ALL.a.concat(ALL.b, ALL.c);
const $ = (id) => document.getElementById(id);
const img = $('img');
let i = 0;

function clamp(n){ return (n + slides.length) % slides.length; }
function show(n, push = true){
  i = clamp(n);
  const [group, src, title, sub] = slides[i];
  img.src = src;
  img.alt = title + ', ' + sub;
  $('count').textContent = (i + 1) + ' / ' + slides.length;
  $('cap').innerHTML = '';
  const t = document.createElement('span'); t.textContent = title;
  const s = document.createElement('small'); s.textContent = sub;
  $('cap').append(t, s);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.g === group));
  document.querySelectorAll('#g-body a').forEach((a, k) => a.classList.toggle('cur', k === i));
  if (push) history.replaceState(null, '', '#' + (i + 1));
  [clamp(i + 1), clamp(i - 1)].forEach(k => { const p = new Image(); p.src = slides[k][1]; });
}

// group tabs + grid
const groups = [...new Set(slides.map(s => s[0]))];
groups.forEach(g => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Вариант ' + g.toUpperCase(); b.dataset.g = g;
  b.onclick = () => show(slides.findIndex(s => s[0] === g));
  $('tabs').append(b);
  const h = document.createElement('h2'); h.textContent = NAMES[g];
  const row = document.createElement('div'); row.className = 'row';
  slides.forEach((s, k) => {
    if (s[0] !== g) return;
    const a = document.createElement('a'); a.href = '#' + (k + 1);
    a.innerHTML = '<img loading="lazy" alt="">' ;
    a.querySelector('img').src = s[1];
    const cap = document.createElement('i'); cap.textContent = s[2] + ' · ' + s[3];
    a.append(cap);
    a.onclick = (e) => { e.preventDefault(); $('grid').classList.remove('on'); show(k); };
    row.append(a);
  });
  $('g-body').append(h, row);
});

$('prev').onclick = $('b-prev').onclick = () => show(i - 1);
$('next').onclick = $('b-next').onclick = () => show(i + 1);
$('b-grid').onclick = () => $('grid').classList.add('on');
$('g-close').onclick = () => $('grid').classList.remove('on');
$('fs').onclick = () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (document.exitFullscreen) document.exitFullscreen();
};
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
  else if (e.key === 'Escape') $('grid').classList.remove('on');
  else if (e.key.toLowerCase() === 'f') $('fs').click();
});
let x0 = null, y0 = null;
$('stage').addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
$('stage').addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(i + (dx < 0 ? 1 : -1));
  x0 = null;
});
addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== i) show(n - 1, false); });
const start = parseInt(location.hash.slice(1), 10);
show(start ? start - 1 : 0, false);
</script>
</body>
</html>
