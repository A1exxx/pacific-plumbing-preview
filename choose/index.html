<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacific Plumbing: выберите вариант</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Pacific Plumbing: выберите вариант">
<meta property="og:image" content="shots/c-index-desktop.webp">
<link rel="icon" href="../img/favicon.png">
<style>
:root{--bg:oklch(97.6% .004 210);--ink:oklch(18% .012 230);--line:oklch(18% .012 230 / .12);--teal:oklch(72% .13 200);--a:oklch(66% .19 45);--b:oklch(66% .12 52);--c:oklch(72% .13 200)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
.wrap{width:min(1180px,100% - 28px);margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand img{width:48px}
.all{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;white-space:nowrap}
.opt{padding:22px 0 8px}
.opt + .opt{border-top:1px solid var(--line)}
.letter{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:14px;font-weight:900;font-size:1.8rem;margin-bottom:12px}
.a .letter{background:var(--a)} .b .letter{background:var(--b)} .c .letter{background:var(--c)}
.screens{display:grid;grid-template-columns:.42fr 1fr;gap:10px;align-items:start}
.screens a{display:block;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 18px 40px -26px oklch(18% .012 230 / .45);background:#fff}
.print{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;align-items:start}
.print a{display:block;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#fff}
.print.wide{grid-template-columns:repeat(2,1fr)}
.open{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:12px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800}
.open:active{transform:scale(.99)}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
footer{height:24px}
@media (min-width:820px){
  .screens{grid-template-columns:.3fr 1fr;gap:16px}
  .print{grid-template-columns:repeat(6,minmax(0,150px))}
  .print.wide{grid-template-columns:repeat(2,minmax(0,300px))}
  .open{display:inline-flex;padding:0 28px}
}
</style>
</head>
<body>
<header class="wrap">
  <span class="brand"><img src="../img/mark.png" width="240" height="160" alt="">Pacific Plumbing</span>
  <a class="all" href="show.html">На весь экран</a>
</header>

<main class="wrap">
  <section class="opt a" id="a" aria-label="Вариант A">
    <span class="letter">A</span>
    <div class="screens">
      <a href="../a/"><img src="shots/a-index-phone.webp" width="780" height="1688" loading="lazy" alt="Вариант A, телефон"></a>
      <a href="../a/"><img src="shots/a-index-desktop.webp" width="1440" height="900" loading="lazy" alt="Вариант A, компьютер"></a>
    </div>
    <div class="print">
      <a href="show.html?v=a#7"><img src="../print/previews/a-doorhanger-p1.png" loading="lazy" alt="Вешалка A"></a>
      <a href="show.html?v=a#8"><img src="../print/previews/a-doorhanger-p2.png" loading="lazy" alt="Вешалка A, оборот"></a>
      <a href="show.html?v=a#9"><img src="../print/previews/a-flyer-p1.png" loading="lazy" alt="Листовка A"></a>
      <a href="show.html?v=a#10"><img src="../print/previews/a-flyer-p2.png" loading="lazy" alt="Листовка A, оборот"></a>
    </div>
    <a class="open" href="../a/">Открыть сайт A</a>
  </section>

  <section class="opt b" id="b" aria-label="Вариант B">
    <span class="letter">B</span>
    <div class="screens">
      <a href="../b/"><img src="shots/b-index-phone.webp" width="780" height="1688" loading="lazy" alt="Вариант B, телефон"></a>
      <a href="../b/"><img src="shots/b-index-desktop.webp" width="1440" height="900" loading="lazy" alt="Вариант B, компьютер"></a>
    </div>
    <div class="print">
      <a href="show.html?v=b#7"><img src="../print/previews/b-doorhanger-p1.png" loading="lazy" alt="Вешалка B"></a>
      <a href="show.html?v=b#8"><img src="../print/previews/b-doorhanger-p2.png" loading="lazy" alt="Вешалка B, оборот"></a>
      <a href="show.html?v=b#9"><img src="../print/previews/b-flyer-p1.png" loading="lazy" alt="Листовка B"></a>
      <a href="show.html?v=b#10"><img src="../print/previews/b-flyer-p2.png" loading="lazy" alt="Листовка B, оборот"></a>
    </div>
    <a class="open" href="../b/">Открыть сайт B</a>
  </section>

  <section class="opt c" id="c" aria-label="Вариант C">
    <span class="letter">C</span>
    <div class="screens">
      <a href="../c/"><img src="shots/c-index-phone.webp" width="780" height="1688" loading="lazy" alt="Вариант C, телефон"></a>
      <a href="../c/"><img src="shots/c-index-desktop.webp" width="1440" height="900" loading="lazy" alt="Вариант C, компьютер"></a>
    </div>
    <div class="print">
      <a href="show.html?v=c#7"><img src="../print/previews/c-doorhanger-p1.png" loading="lazy" alt="Вешалка C1"></a>
      <a href="show.html?v=c#8"><img src="../print/previews/c-doorhanger-p2.png" loading="lazy" alt="Вешалка C1, оборот"></a>
      <a href="show.html?v=c#9"><img src="../print/previews/c-doorhanger-2-p1.png" loading="lazy" alt="Вешалка C2"></a>
      <a href="show.html?v=c#10"><img src="../print/previews/c-doorhanger-2-p2.png" loading="lazy" alt="Вешалка C2, оборот"></a>
      <a href="show.html?v=c#11"><img src="../print/previews/c-doorhanger-3-p1.png" loading="lazy" alt="Вешалка C3"></a>
      <a href="show.html?v=c#12"><img src="../print/previews/c-doorhanger-3-p2.png" loading="lazy" alt="Вешалка C3, оборот"></a>
      <a href="show.html?v=c#13"><img src="../print/previews/c-flyer-p1.png" loading="lazy" alt="Листовка C1"></a>
      <a href="show.html?v=c#14"><img src="../print/previews/c-flyer-p2.png" loading="lazy" alt="Листовка C1, оборот"></a>
      <a href="show.html?v=c#15"><img src="../print/previews/c-flyer-2-p1.png" loading="lazy" alt="Листовка C2"></a>
      <a href="show.html?v=c#16"><img src="../print/previews/c-flyer-2-p2.png" loading="lazy" alt="Листовка C2, оборот"></a>
    </div>
    <div class="print wide">
      <a href="show.html?v=c#17"><img src="../print/previews/c-businesscard-p1.png" loading="lazy" alt="Визитка"></a>
      <a href="show.html?v=c#18"><img src="../print/previews/c-businesscard-p2.png" loading="lazy" alt="Визитка, оборот"></a>
    </div>
    <a class="open" href="../c/">Открыть сайт C</a>
  </section>
</main>
<footer></footer>
</body>
</html>
